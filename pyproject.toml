[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents"
version = "0.0.1"
description = "Agentic workloads, skills, harness, and memory infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Roman Mednitzer" },
]
keywords = ["agents", "agentic", "ai", "llm", "harness"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic-ai>=1.97.0",
    "pydantic>=2.13.4",
    "logfire>=4.33.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Production memory backends. Lazily imported; the core works without
# them. Install the extra to use the adapter (ADR 0007).
redis = [
    "redis>=6.0.0",
]
aws = [
    "boto3>=1.40.0",
]
otel = [
    "opentelemetry-sdk>=1.30.0",
]
crypto = [
    "cryptography>=43.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12.20240917",
    # Backends + test doubles so CI exercises every adapter.
    "redis>=6.0.0",
    "fakeredis>=2.20.0",
    "boto3>=1.40.0",
    "moto[s3,dynamodb]>=5.0.0",
    "opentelemetry-sdk>=1.30.0",
    "cryptography>=43.0.0",
]

[project.urls]
Repository = "https://github.com/rmednitzer/agents"
Issues = "https://github.com/rmednitzer/agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["agents", "harness", "memory", "skills", "workloads"]

[project.scripts]
agents = "agents.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "PT"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Optional backends' SDKs ship no type information. The adapters wrap
# them behind typed MemoryStore Protocols, so treat the SDK surface as
# untyped at the boundary rather than vendoring stubs.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
