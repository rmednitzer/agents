name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # BL-152: REUSE 3.x compliance gate (REUSE.toml + LICENSES/).
      - run: uvx reuse lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run mypy agents harness memory workloads skills evaluation

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest --cov=agents --cov=harness --cov=memory --cov=skills --cov=workloads --cov=evaluation --cov-report=term-missing --cov-report=xml --cov-fail-under=94
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml-${{ matrix.python }}
          path: coverage.xml

  # BL-150: a BLOCKING dependency-audit gate. Renovate proposes
  # updates but is not a gate; this fails CI when a locked dependency
  # has a known advisory. The lockfile (uv.lock) is exported to a pinned
  # requirements set and audited with pip-audit, so the gate matches
  # exactly what is installed, not floating ranges.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Assert the lockfile matches pyproject.toml
        # BL-237: a specifier bump merged without re-resolving uv.lock
        # makes every later gate validate an older dependency surface
        # than pyproject.toml declares (the drift class remediated on
        # 2026-05-27, audit/2026-05-27-engagement.md section 4.2).
        # `uv export --frozen` below deliberately does NOT check
        # freshness; this step fails the job at the PR boundary
        # instead of letting the drift accumulate over a wave.
        run: uv lock --check
      - name: Export the locked dependency set
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o audit-requirements.txt
      - name: Audit locked dependencies for known advisories
        # BL-194: --python 3.12 pins pip-audit's dry-run env to the
        # project's required Python (`requires-python = ">=3.12"`).
        # Without it, uvx picks Python 3.11 and the marker
        # `python_version < "3.12"` on `backports.tarfile` (transitive
        # of `jaraco-context`) becomes true, pulling an unpinned `>=`
        # constraint that breaks pip's `--require-hashes` mode. The
        # audit env must match what is actually installed.
        #
        # BL-236: the PYSEC-2025-183 (pyjwt) suppression carried here
        # since BL-194 was removed on 2026-06-12: the locked pyjwt
        # (2.13.0) is no longer flagged, so the unsuppressed audit is
        # clean and a kept ignore could only mask a future advisory
        # republished under the same ID.
        run: uvx --python 3.12 pip-audit --strict --progress-spinner=off -r audit-requirements.txt

  # BL-130: the behavioural regression gate. CI verifies code shape;
  # this fails when dispatch routing quality (P@1 / MRR over the
  # in-tree golden set, deterministic KeywordDispatcher) regresses
  # below threshold. Network-free, so it is a blocking gate.
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run python scripts/eval.py --min-p-at-1 1.0 --min-mrr 1.0

  # Stable aggregate gate. Its name never changes with the test matrix,
  # so branch protection can require this one context instead of the
  # matrix-expanded "test (3.x)" names (whose context names change when
  # the matrix changes, which silently breaks a required check).
  ci-success:
    name: ci-success
    if: always()
    needs: [lint, type-check, test, dependency-audit, evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have succeeded
        run: |
          echo "lint=${{ needs.lint.result }} type-check=${{ needs.type-check.result }} test=${{ needs.test.result }} dependency-audit=${{ needs.dependency-audit.result }} evaluation=${{ needs.evaluation.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.type-check.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.dependency-audit.result }}" = "success" ] \
            && [ "${{ needs.evaluation.result }}" = "success" ]
