name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # BL-152: REUSE 3.x compliance gate (REUSE.toml + LICENSES/).
      - run: uvx reuse lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run mypy agents harness memory workloads skills evaluation

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest --cov=agents --cov=harness --cov=memory --cov=skills --cov=workloads --cov=evaluation --cov-report=term-missing --cov-report=xml --cov-fail-under=94
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python }}
          path: coverage.xml

  # BL-150: a BLOCKING dependency-audit gate. Dependabot proposes
  # updates but is not a gate; this fails CI when a locked dependency
  # has a known advisory. The lockfile (uv.lock) is exported to a pinned
  # requirements set and audited with pip-audit, so the gate matches
  # exactly what is installed, not floating ranges.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Export the locked dependency set
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o audit-requirements.txt
      - name: Audit locked dependencies for known advisories
        run: uvx pip-audit --strict --progress-spinner=off -r audit-requirements.txt

  # BL-130: the behavioural regression gate. CI verifies code shape;
  # this fails when dispatch routing quality (P@1 / MRR over the
  # in-tree golden set, deterministic KeywordDispatcher) regresses
  # below threshold. Network-free, so it is a blocking gate.
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run python scripts/eval.py --min-p-at-1 1.0 --min-mrr 1.0

  # Stable aggregate gate. Its name never changes with the test matrix,
  # so branch protection can require this one context instead of the
  # matrix-expanded "test (3.x)" names (whose context names change when
  # the matrix changes, which silently breaks a required check).
  ci-success:
    name: ci-success
    if: always()
    needs: [lint, type-check, test, dependency-audit, evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have succeeded
        run: |
          echo "lint=${{ needs.lint.result }} type-check=${{ needs.type-check.result }} test=${{ needs.test.result }} dependency-audit=${{ needs.dependency-audit.result }} evaluation=${{ needs.evaluation.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.type-check.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.dependency-audit.result }}" = "success" ] \
            && [ "${{ needs.evaluation.result }}" = "success" ]
