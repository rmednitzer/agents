name: release

# BL-151: tag-triggered release. Pre-1.0 there are no published
# releases yet; this workflow is the lifecycle that a 0.0.x -> 0.1.0
# tag will exercise. It builds reproducible sdist/wheel artifacts,
# emits a CycloneDX SBOM, and attests build provenance (SLSA-style)
# via GitHub's artifact attestation. Publishing to an index is
# intentionally NOT automated yet (see docs/releasing.md): the gate to
# a first published release is human.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12

      # Quality gate before anything is published: a release must be
      # green (the same gate as CI), so a bad commit cannot be tagged
      # into a release.
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy agents harness memory workloads skills evaluation
      - run: uv run pytest --cov=agents --cov=harness --cov=memory --cov=skills --cov=workloads --cov=evaluation --cov-fail-under=94
      - run: uv run python scripts/eval.py --min-p-at-1 1.0 --min-mrr 1.0
      - run: uvx reuse lint

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Generate CycloneDX SBOM
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o sbom-requirements.txt
          uvx cyclonedx-py requirements sbom-requirements.txt --output-format JSON --outfile dist/sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4
        with:
          subject-path: "dist/*"

      - name: Create GitHub release with artifacts + SBOM
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/sbom.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
